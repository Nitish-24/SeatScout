<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="seatscout-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#seatscout-grad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Radio Radar Broadcast Rings -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Beacon Point -->
    <circle cx="32" cy="32" r="4.5" fill="#ffffff" stroke="none" />
    
    <!-- Inner Waves -->
    <path d="M 40.5 23.5 A 12 12 0 0 1 40.5 40.5" stroke-width="3.5" />
    <path d="M 23.5 40.5 A 12 12 0 0 1 23.5 23.5" stroke-width="3.5" />
    
    <!-- Outer Waves -->
    <path d="M 47.5 16.5 A 22 22 0 0 1 47.5 47.5" stroke-width="3.5" />
    <path d="M 16.5 47.5 A 22 22 0 0 1 16.5 16.5" stroke-width="3.5" />
  </g>

  <!-- Live Pulse Dot Indicator -->
  <circle cx="49" cy="49" r="4" fill="#34d399" stroke="#ffffff" stroke-width="1.5" />
</svg>
